alerts:
  - name: HighLatencyP95
    severity: critical
    condition: "latency_p95 > 3000ms"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: "error_rate_pct > 2% or tool_success_rate_pct < 90%"
    duration: 3m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-2
  - name: CostSpike
    severity: warning
    condition: "cost_usd_total > 2.5"
    duration: 10m
    type: symptom-based
    channel: slack
    owner: finops-team
    runbook: docs/alerts.md#alert-3

